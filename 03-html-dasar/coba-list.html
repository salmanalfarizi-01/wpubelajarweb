<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba list</title>
  </head>
  <body>
    <h2>Order list/ daftar terurut</h2>
    <ol type="a">
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>item 4</li>
      <li>item 5</li>
    </ol>
    <h2>unordered list/ daftar tidak terurut</h2>
    <ul type="squere">
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>item 4</li>
      <li>item 5</li>
    </ul>

    <h2>Description</h2>
    <dl>
      <dt>HTML</dt>
      <dd>Hypertext Markup Languege</dd>
      <dt>CSS</dt>
      <dd>Cascading Style Sheet</dd>
    </dl>
  </body>
</html>
