<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qoute Galau</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(63, 63, 63);
        text-align: center;
      }
      h1 {
        font-size: 48px;
        text-transform: uppercase;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        font-style: italic;
        text-decoration-color: rgb(100, 100, 100);
        text-shadow: 5px 5px 0 rgb(210, 210, 210);
      }

      .quote {
        font-size: 40px;
        line-height: 2.2;
        word-spacing: 20px;
      }

      span {
        color: rgb(189, 188, 188);
        text-decoration: line-through;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(155, 152, 152);
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>Seni Keindahan</h1>
    <p class="quote">
      "Tak perlu khawatir, ku hanya <span>terluka</span>. <br />
      Terbiasa tuk pura-pura tertawa. <br />
      Namun bolehkah sekali saja ku menangis? <br />
      Sebelum kembali membohongi diri."
    </p>
    <p class="credit">— feby putri feat. fiersa besari</p>
  </body>
</html>
