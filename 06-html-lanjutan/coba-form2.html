<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contoh input atribut, checkbox & radio</title>
  </head>
  <body>
    <h1>contoh input atribut, checkbox & radio</h1>
    <form>
      <label for="name"
        >Nama:
        <input
          type="text"
          name="nama"
          id="nama"
          placeholder="Masukkan nama"
          autocomplete="off"
          autofocus
          required
        />
      </label>

      <br />

      <h3>Hobby</h3>
      <label for="hobby1">
        <input
          type="checkbox"
          name="hobby1"
          id="hobby1"
          value="olahraga"
          checked
        />olahraga</label
      >
      <br />
      <label for="hobby2">
        <input
          type="checkbox"
          name="hobby2"
          id="hobby2"
          value="ngoding"
        />ngoding</label
      >
      <br />
      <label for="hobby3">
        <input
          type="checkbox"
          name="hobby3"
          id="hobby3"
          value="lari"
        />lari</label
      >

      <br />
      <h3>Jenis Kelamin:</h3>
      <label for="pria">
        <input
          type="radio"
          name="jenis_kelamin"
          id="pria"
          value="pria"
          checked
        />pria
      </label>
      <br />
      <label for="wanita">
        <input
          type="radio"
          name="jenis_kelamin"
          id="wanita"
          value="wanita"
        />wanita
      </label>

      <br />
      <button type="submit">kirim!</button>
    </form>
  </body>
</html>
